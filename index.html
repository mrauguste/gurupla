<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --paper:#F5EBD6;--paper-light:#FFF9EC;--ink:#25212B;--purple:#5C32B5;--coral:#FF6257;--yellow:#FFD54A;
  --cyan:#42C6E5;--green:#65D6A0;--pink:#F37BB5;--wood:#D9BC91;--brass:#BE9854;--border:#C9BBA3;
  --ease:cubic-bezier(.3,.85,.3,1.04);--dur:.38s;
  --f-display:'Space Grotesk','Avenir Next','Helvetica Neue',Arial,sans-serif;
  --f-body:'DM Sans','Avenir Next','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.08;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .15 0 0 0 0 .13 0 0 0 0 .17 0 0 0 .9 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
#app{position:relative;z-index:1}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;letter-spacing:-.02em;line-height:1.05}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--purple)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px 56px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{opacity:.72}.small{font-size:13px}.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.sticky{flex-wrap:wrap;gap:10px}.sticky>*{flex:0 1 auto;max-width:100%}
.stub{min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.mt{margin-top:18px}.mt2{margin-top:30px}

/* ---------- üst çubuk ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--f-display);font-weight:700;font-size:32px;letter-spacing:-.05em;line-height:1}
.brand small{font-size:12px;font-weight:500;opacity:.7;letter-spacing:.01em}
.top nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo-chip{font:700 11px var(--f-display);letter-spacing:.08em;border:2px solid var(--ink);border-radius:999px;padding:5px 10px;background:var(--yellow);box-shadow:2px 2px 0 var(--ink)}

/* ---------- fiziksel butonlar ---------- */
.btn{--bg:var(--purple);--fg:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;
  background:var(--bg);color:var(--fg);border:2.5px solid var(--ink);border-radius:14px;font:700 16px var(--f-display);letter-spacing:-.01em;
  box-shadow:0 5px 0 var(--ink);cursor:pointer;text-decoration:none;transition:transform .12s var(--ease),box-shadow .12s var(--ease);user-select:none;-webkit-tap-highlight-color:transparent}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 0 var(--ink)}
.btn:active,.btn.on{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.coral{--bg:var(--coral);--fg:var(--ink)}.btn.yellow{--bg:var(--yellow);--fg:var(--ink)}.btn.cyan{--bg:var(--cyan);--fg:var(--ink)}
.btn.green{--bg:var(--green);--fg:var(--ink)}.btn.ghost{--bg:var(--paper-light);--fg:var(--ink)}.btn.dark{--bg:var(--ink);--fg:var(--paper-light)}
.btn.sm{min-height:44px;padding:8px 14px;font-size:14px;border-radius:12px;box-shadow:0 4px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 3px 0 var(--ink)}
.btn.big{min-height:58px;font-size:19px;padding:12px 28px;border-radius:16px;box-shadow:0 6px 0 var(--ink)}
.link{background:none;border:0;color:var(--purple);text-decoration:underline;cursor:pointer;padding:10px 4px;min-height:44px;font-weight:700}

/* ---------- paneller ---------- */
.panel{position:relative;background:var(--paper-light);border:2.5px solid var(--ink);border-radius:20px;padding:22px;box-shadow:5px 5px 0 var(--ink)}
.panel.rivets::before,.panel.rivets::after{content:"";position:absolute;top:10px;width:9px;height:9px;border-radius:50%;background:var(--brass);border:1.5px solid var(--ink)}
.panel.rivets::before{left:10px}.panel.rivets::after{right:10px}
.panel.flat{box-shadow:none}
.panel h2{font-size:26px;margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font:700 13px var(--f-display);letter-spacing:.06em;text-transform:none;opacity:.75}
.inp{width:100%;min-height:48px;padding:10px 14px;background:#fff;border:2.5px solid var(--ink);border-radius:12px;box-shadow:inset 0 3px 0 rgba(37,33,43,.1);font-size:16px}
.inp.xl{font:700 clamp(24px,5vw,36px) var(--f-display);min-height:64px;letter-spacing:-.02em}
.err{color:#B42318;font-weight:700;font-size:14px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:3px 10px;font:700 12px var(--f-display);background:var(--paper-light)}
.chip.p{background:var(--purple);color:#fff}.chip.g{background:var(--green)}.chip.y{background:var(--yellow)}.chip.c{background:var(--coral)}.chip.b{background:var(--cyan)}
.shp{display:inline-block;vertical-align:middle;flex:none}

/* ---------- aşama çubuğu ---------- */
.stages{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px;scrollbar-width:thin}
.stage{flex:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 14px 6px 8px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper-light);text-decoration:none;color:var(--ink);font:700 14px var(--f-display);box-shadow:0 3px 0 var(--ink)}
.stage i{font-style:normal;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--wood);border:2px solid var(--ink);font-size:12px}
.stage.cur{background:var(--purple);color:#fff;transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.stage.cur i{background:var(--yellow);color:var(--ink)}
.mhead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.mhead h1{font-size:clamp(28px,5vw,44px)}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.who select{min-height:44px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;padding:6px 10px;font-weight:700}

/* ---------- tipografi ---------- */
.display{font-weight:700;font-size:clamp(46px,10vw,104px);line-height:.92;letter-spacing:-.045em}
.kicker{font:700 15px var(--f-display);letter-spacing:0;text-transform:none;color:var(--purple)}
.lead{font-size:clamp(17px,2.4vw,21px);max-width:34ch}
.intro-note{margin-top:22px;max-width:44ch;font-size:17px;line-height:1.5;color:var(--ink)}
.intro-note b{font-weight:700}
.lc{text-transform:lowercase}
.rbar{position:relative;height:12px;background:var(--ink);border-radius:99px;margin:18px 11px 4px}
.rbar .rfill{position:absolute;left:0;top:0;bottom:0;background:var(--purple);border-radius:99px;opacity:.35}
.rbar .rd{position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--purple);border:3px solid var(--ink)}
.drow{display:flex;flex-wrap:wrap;gap:12px}
.tkw{position:relative}
.vize-cap{position:relative;display:block;width:fit-content;max-width:calc(100% + 56px);padding:76px 28px 28px;margin:-76px 0 -28px -28px}
.vize-link{position:absolute;top:12px;right:28px;z-index:3}
.stamp-ok{position:absolute;right:16px;top:58px;z-index:5;transform:rotate(-12deg);border:3px double var(--green);color:var(--green);font:800 15px var(--f-display);padding:6px 12px;border-radius:10px;background:rgba(255,249,236,.85);pointer-events:none;text-transform:lowercase}
.hbar .rfill{background:var(--cyan);opacity:1}
.hbar .rd{background:var(--cyan)}
.drow .field{min-width:0;flex:0 1 auto}
.date-inp{width:176px;max-width:100%;box-sizing:border-box;text-align:center;padding-left:8px;padding-right:8px;min-width:0}
body{text-transform:lowercase}
.btn,button{text-transform:none}
.trust{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:30px;font-size:13px;color:var(--ink);opacity:.75}
.trust span{display:inline-flex;align-items:center;gap:7px}
.bignum{font-family:var(--f-display);font-weight:700;letter-spacing:-.05em;line-height:.85}

/* ---------- landing ---------- */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:30px;align-items:center;padding:10px 0 34px}
.hero .cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px}
.hero-cal{position:relative;padding:18px}
.hero-cal .geo{position:absolute;pointer-events:none}
.geo.g1{width:92px;height:92px;border-radius:50%;background:var(--yellow);border:2.5px solid var(--ink);top:-6px;left:-4px}
.geo.g2{width:0;height:0;border-left:44px solid transparent;border-right:44px solid transparent;border-bottom:78px solid var(--coral);right:2px;top:2px;filter:drop-shadow(0 0 0 var(--ink))}
.geo.g3{width:70px;height:70px;background:var(--cyan);border:2.5px solid var(--ink);right:-2px;bottom:76px;transform:rotate(12deg);border-radius:10px}
.geo.g4{width:58px;height:58px;background:var(--pink);border:2.5px solid var(--ink);left:6px;bottom:84px;transform:rotate(45deg);border-radius:6px}
.hero-cal .cal{position:relative}
.hero-cal .calctl,.hero-cal .cap{position:relative;z-index:2}
.hero-cal{padding-bottom:24px}
.cap{position:relative;text-align:center;font:700 14px var(--f-display);margin-top:6px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:12px 0 34px}
.step{position:relative;border:2.5px solid var(--ink);border-radius:22px;padding:22px;min-height:230px;box-shadow:5px 5px 0 var(--ink);overflow:hidden}
.step h3{font-size:26px;position:relative;max-width:11ch}
.step p{position:relative;margin-top:8px;max-width:24ch;font-size:15px}
.step .no{font:700 90px var(--f-display);position:absolute;right:12px;bottom:-14px;opacity:.9;line-height:1;letter-spacing:-.06em}
.step.s1{background:var(--purple);color:#fff}.step.s1 .no{color:var(--yellow)}
.step.s2{background:var(--green)}.step.s3{background:var(--yellow)}
.step svg.deco{position:absolute;left:18px;bottom:16px}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mcard{display:flex;flex-direction:column;gap:8px;background:var(--paper-light);border:2.5px solid var(--ink);border-radius:16px;padding:14px;box-shadow:4px 4px 0 var(--ink)}
.mcard b{font:700 18px var(--f-display)}

/* ---------- mekanik takvim ---------- */
.cal{width:100%;max-width:410px;margin:0 auto;display:block;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:visible}
.cal .disc{transform:rotate(var(--rot,0deg));transition:transform var(--dur) var(--ease)}
.cal .up{transform:translate(var(--x,0px),var(--y,0px)) rotate(calc(var(--rot,0deg) * -1));transition:transform var(--dur) var(--ease)}
.cal path.w{fill:var(--paper-light);stroke:var(--ink);stroke-width:1.4;cursor:pointer}
.cal path.w.alt{fill:#F8EDD3}.cal path.w.wk{fill:#E3F4F4}.cal path.w.off{fill:#E9E0CC;cursor:default}
.cal path.w:hover{fill:#FFF0B0}.cal path.w.sel{fill:#FFD3C9}
.cal path.wi{fill:var(--purple);stroke:var(--ink);stroke-width:1.4;pointer-events:none}.cal path.wi.alt{fill:#6C42C7}
.cal text{font-family:var(--f-display);pointer-events:none;fill:var(--ink)}
.cal .num{font-weight:700;font-size:22px}.cal.dense .num{font-size:17px}
.cal .wd{font-weight:700;font-size:12px;fill:#fff;letter-spacing:.02em}
.cal .cnum{font-weight:700;font-size:64px;letter-spacing:-.05em}
.cal .cnum.tick{animation:tick .36s var(--ease)}
.cal .cmon{font-weight:700;font-size:13px;letter-spacing:.14em;fill:var(--purple)}
.cal .cwd{font-weight:700;font-size:15px}
.cal:focus-visible{outline:3px solid var(--cyan);outline-offset:6px;border-radius:50%}
.cal.locked{animation:lock .4s ease-out}
@keyframes tick{0%{transform:translateY(-10px);opacity:0}100%{transform:none;opacity:1}}
@keyframes lock{0%,100%{transform:none}30%{transform:rotate(-1.4deg)}60%{transform:rotate(.9deg)}}
.calctl{display:flex;justify-content:center;gap:10px;margin-top:10px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:6px 4px 12px;margin-top:8px;scroll-snap-type:x proximity}
.dchip{flex:none;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:58px;min-height:72px;padding:6px 4px;border:2.5px solid var(--ink);border-radius:14px;background:var(--paper-light);box-shadow:0 4px 0 var(--ink);cursor:pointer;font-family:var(--f-display)}
.dchip small{font-size:11px;font-weight:700;opacity:.7}.dchip b{font-size:20px;line-height:1}
.dchip.cur{background:var(--purple);color:#fff;transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.dchip.wk small{color:var(--coral)}.dchip.cur.wk small{color:var(--yellow)}

/* ---------- gün durumu & saat dilimleri ---------- */
.daybtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:84px;padding:10px 6px;border:2.5px solid var(--ink);border-radius:16px;background:var(--paper-light);box-shadow:0 5px 0 var(--ink);cursor:pointer;font:700 15px var(--f-display);transition:transform .12s var(--ease),box-shadow .12s var(--ease),background .12s}
.dbtn.on{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.dbtn.k-preferred.on{background:var(--green)}.dbtn.k-possible.on{background:var(--yellow)}.dbtn.k-unavailable.on{background:var(--coral)}
.brushes{display:flex;gap:8px;flex-wrap:wrap}
.brush{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 14px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper-light);font:700 14px var(--f-display);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.brush.on{transform:translateY(2px);box-shadow:0 1px 0 var(--ink);background:var(--ink);color:var(--paper-light)}
.period{border:2.5px solid var(--ink);border-radius:16px;background:var(--paper-light);overflow:hidden}
.period+.period{margin-top:10px}
.phead{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:8px 14px;background:none;border:0;cursor:pointer;font:700 17px var(--f-display);text-align:left}
.phead small{font:500 13px var(--f-body);opacity:.7}
.phead .cnt{margin-left:auto}
.phead .chev{transition:transform .2s;font-size:14px}
.period.open .chev{transform:rotate(180deg)}
.avfoot{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.avfoot>.btn{margin-right:auto}
.avfoot .avday{font:700 15px var(--f-display);color:var(--ink);white-space:nowrap}
.avfoot .larr{width:44px;height:44px}
.lcal{text-align:center}
.pline{display:flex;align-items:stretch;gap:10px;margin-top:14px}
.pvert{writing-mode:vertical-rl;transform:rotate(180deg);font:600 12px var(--f-display);color:var(--ink);opacity:.55;border-right:1.5px dashed var(--ink);padding-right:8px;white-space:nowrap}
.pline{align-items:flex-start}
.pline .slots{flex:1;min-width:0;padding-top:0;align-content:start;grid-auto-rows:64px}
.pline .slot{height:64px;min-height:0}
.period.open .pbody{display:block}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:9px;padding-top:12px;touch-action:none;user-select:none;-webkit-user-select:none}
.slot{position:relative;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:0 4px 0 var(--ink);cursor:pointer;font:700 15px var(--f-display);transition:transform .12s var(--ease),box-shadow .12s var(--ease),background .12s;touch-action:none}
.slot .shp{height:12px;width:12px}
.slot.s-preferred{background:var(--green);transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.slot.s-possible{background:var(--yellow);transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.slot.s-unavailable{background:var(--coral);transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.runs{display:flex;gap:8px;flex-wrap:wrap}
.prog{display:flex;gap:4px;flex-wrap:wrap}.prog span{width:16px;height:16px;border:2px solid var(--ink);border-radius:4px;background:var(--paper)}
.prog .p-preferred{background:var(--green)}.prog .p-possible{background:var(--yellow)}.prog .p-unavailable{background:var(--coral)}.prog .cur{outline:3px solid var(--purple);outline-offset:1px}

/* ---------- bilet ---------- */
.ticket{position:relative;display:flex;border:2.5px solid var(--ink);border-radius:22px;background:var(--paper-light);box-shadow:6px 6px 0 var(--ink);overflow:hidden}
.ticket .main{flex:1;padding:22px 24px;min-width:0}
.ticket .stub{width:38%;flex:none;padding:22px 20px;border-left:2.5px dashed var(--ink);background:var(--paper-light);display:flex;flex-direction:column;gap:10px;justify-content:center}
.ticket::before,.ticket::after{content:"";position:absolute;left:calc(62% - 14px);width:28px;height:28px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink);z-index:2}
.ticket::before{top:-15px}.ticket::after{bottom:-15px}
.ticket .field-c{--c:var(--purple);background:var(--c)}
.ticket.t-purple .main{background:var(--purple);color:#fff}.ticket.t-cyan .main{background:var(--cyan)}.ticket.t-yellow .main{background:var(--yellow)}
.ticket.t-pink .main{background:var(--pink)}.ticket.t-green .main{background:var(--green)}.ticket.t-coral .main{background:var(--coral)}
.ticket .tdate{font:700 clamp(64px,13vw,128px)/0.82 var(--f-display);letter-spacing:-.06em}
.ticket.sm .tdate{font-size:clamp(44px,9vw,64px)}
.ticket .ttime{font:700 clamp(22px,4vw,34px) var(--f-display);letter-spacing:-.03em;margin-top:8px}
.ticket .tsub{font:700 15px var(--f-display);letter-spacing:0;text-transform:none}
.ticket.sm{box-shadow:4px 4px 0 var(--ink)}
.ticket.sm .main{padding:16px 18px}.ticket.sm .stub{padding:14px 16px}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--paper-light);color:var(--ink);border:2.5px solid var(--ink);border-radius:10px;padding:5px 12px 5px 8px;font:700 13px var(--f-display);letter-spacing:.08em;box-shadow:2px 2px 0 var(--ink);margin-bottom:12px}
.meter{height:14px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.meter i{display:block;height:100%;background:var(--green);border-right:2.5px solid var(--ink)}
.meter.pref i{background:var(--purple)}
.rank{display:grid;place-items:center;width:34px;height:34px;border:2.5px solid var(--ink);border-radius:50%;background:var(--paper-light);font:700 16px var(--f-display);color:var(--ink)}
.lines{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:14px}
.lines li{display:flex;gap:8px;align-items:flex-start}
.detail{border-top:2.5px dashed var(--ink);padding:16px 20px;background:var(--paper)}
.stamp{position:absolute;right:18px;top:16px;transform:rotate(-9deg);border:3.5px double var(--coral);color:var(--coral);padding:4px 12px;border-radius:8px;font:700 18px var(--f-display);letter-spacing:.12em;background:rgba(255,249,236,.7);animation:stamp .5s var(--ease) both;z-index:3}
.stamp.ok{border-color:#1E8A5B;color:#1E8A5B}
@keyframes stamp{0%{transform:rotate(-9deg) scale(2.2);opacity:0}70%{transform:rotate(-9deg) scale(.94);opacity:1}100%{transform:rotate(-9deg) scale(1)}}
.reveal{animation:reveal .55s var(--ease) both}
@keyframes reveal{0%{transform:translateY(26px) rotate(-1.5deg);opacity:0}100%{transform:none;opacity:1}}

/* ---------- grup görünümü ---------- */
.grow{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;width:100%;min-height:52px;padding:8px 12px;border:2.5px solid var(--ink);border-radius:14px;background:var(--paper-light);box-shadow:0 4px 0 var(--ink);cursor:pointer;text-align:left}
.grow+.gdetail{margin:6px 0 12px}
.grow.cur{background:#EDE4FF}
.grow .shapes{display:flex;gap:4px;flex-wrap:wrap}
.gdetail{border:2.5px solid var(--ink);border-radius:14px;background:var(--paper);padding:14px}
.dens{display:flex;gap:3px;align-items:flex-end;overflow-x:auto;padding:6px 0 2px}
.dens div{flex:none;width:34px;text-align:center;font:700 11px var(--f-display)}
.dens i{display:block;border:2px solid var(--ink);border-radius:6px 6px 2px 2px;background:var(--green);margin-bottom:3px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:2.5px solid var(--ink);border-radius:14px;background:var(--paper-light);padding:8px 12px}
.prow .nm{font:700 16px var(--f-display);flex:1;min-width:110px}
.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:2.5px solid var(--ink);font:700 16px var(--f-display)}

/* ---------- boş durum, toast, modal ---------- */
.empty{text-align:center;padding:34px 20px}
.empty .shapes{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
.empty h2{font-size:30px}.empty p{max-width:46ch;margin:10px auto 0}
.note{border:2.5px solid var(--ink);border-radius:14px;padding:12px 14px;background:var(--yellow);font-size:14px}
.note.info{background:#D9F2F8}.note.bad{background:#FFD6D1}
#toasts{position:fixed;left:0;right:0;bottom:18px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none}
.toast{pointer-events:auto;background:var(--ink);color:var(--paper-light);border:2.5px solid var(--ink);border-radius:12px;padding:10px 16px;font:700 15px var(--f-display);box-shadow:0 4px 0 var(--purple);animation:reveal .3s var(--ease) both;max-width:92vw}
.overlay{position:fixed;inset:0;background:rgba(37,33,43,.55);display:grid;place-items:center;padding:18px;z-index:50}
.dlg{background:var(--paper-light);border:2.5px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);padding:22px;max-width:440px;width:100%;animation:reveal .3s var(--ease) both}
.dlg h3{font-size:24px;margin-bottom:8px}
.foot{margin-top:40px;padding-top:18px;border-top:2.5px dashed var(--border);font-size:13px;display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.bar{display:flex;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper-light)}.dot.on{background:var(--purple)}.dot.done{background:var(--green)}
.hourctl{display:flex;align-items:center;gap:8px}
.odo{min-width:92px;text-align:center;font:700 30px var(--f-display);letter-spacing:-.03em;background:var(--ink);color:var(--paper-light);border-radius:10px;padding:4px 10px;border:2.5px solid var(--ink);box-shadow:inset 0 3px 0 rgba(255,255,255,.12)}
.durs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.dur{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:104px;justify-content:center;border:2.5px solid var(--ink);border-radius:16px;background:var(--paper-light);box-shadow:0 5px 0 var(--ink);cursor:pointer;font:700 20px var(--f-display);padding:10px}
.dur.on{background:var(--yellow);transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.hourbar{position:relative;height:22px;border:2.5px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
.hourbar i{position:absolute;top:0;bottom:0;background:var(--cyan);border-left:2.5px solid var(--ink);border-right:2.5px solid var(--ink)}

/* ---------- responsive ---------- */
.two{display:grid;grid-template-columns:minmax(440px,520px) 1fr;gap:26px;align-items:start}
.two>*,.grid2>*{min-width:0}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}.hero-cal{order:-1;max-width:420px;margin:0 auto;width:100%}
  .steps{grid-template-columns:1fr}.step{min-height:170px}.two{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:640px){
  .wrap{padding:0 14px 48px}.brand small{display:none}
  .cal{max-width:260px}.cal.big{max-width:340px}
  .ticket{flex-direction:column}.ticket .stub{width:auto;border-left:0;border-top:2.5px dashed var(--ink)}
  .ticket::before,.ticket::after{display:none}
  .grow{grid-template-columns:1fr auto}.grow .shapes{grid-column:1/3;order:3}
  .panel{padding:16px}.daybtns{gap:8px}.dbtn{font-size:13px}
  .stamp{font-size:14px;right:10px;top:10px}
  .sticky{position:sticky;bottom:0;background:linear-gradient(transparent,var(--paper) 30%);padding:18px 0 10px;z-index:5}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ===== v2: sadeleştirme ===== */
.panel{box-shadow:3px 3px 0 var(--ink);padding:18px;border-radius:18px}
.panel.rivets::before,.panel.rivets::after{display:none}
.brand small{display:none}
.demo-chip{font-size:10px;padding:3px 8px;box-shadow:none}
.stage{min-height:36px;font-size:13px;padding:3px 12px 3px 5px;box-shadow:none}
.stage i{width:22px;height:22px;font-size:11px}
.stage.cur{transform:none}
.foot{margin-top:28px;font-size:12px;opacity:.75}
.btn{box-shadow:0 4px 0 var(--ink)}
.btn.big{min-height:54px}
.mhead h1{font-size:clamp(26px,4.5vw,38px)}
.hero{display:block;padding:18px 0 10px}
.hero .display{font-size:clamp(44px,9vw,84px)}
.hero .cta{margin-top:22px}

/* ===== lineer takvim ===== */
.lcal{width:100%;max-width:720px;margin:0 auto}
.lhead{display:flex;align-items:baseline;justify-content:center;gap:10px;margin-bottom:10px;font-family:var(--f-display)}
.lhead .lmon{display:none}
.lhead .lwd{font-size:20px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.lrow{display:flex;align-items:center;gap:8px}
.larr{flex:none;width:48px;height:48px;display:grid;place-items:center;border:2.5px solid var(--ink);border-radius:14px;background:var(--paper-light);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .12s var(--ease),box-shadow .12s var(--ease)}
.larr:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.larr[disabled]{opacity:.3;cursor:default;box-shadow:0 2px 0 var(--ink)}
.lview{position:relative;flex:1;min-width:0;overflow:hidden;height:104px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.lview::after{content:"";position:absolute;left:50%;top:2px;bottom:2px;width:70px;margin-left:-35px;border:2.5px solid var(--ink);border-radius:20px;background:rgba(92,50,181,.09);pointer-events:none}

<body>
<div id="app"><noscript>benme için JavaScript gerekiyor.</noscript></div>
<script>
"use strict";
/*ENGINE-START*/
const DAY_NAMES=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const DAY_SHORT=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const pad=n=>String(n).padStart(2,'0');

/* Takvim tarihleri: YYYY-MM-DD, yerel saat, UTC'ye çevrilmez (öğlen 12:00 ile DST kaymasından korunur). */
const D={
  valid(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&D.fmt(D.parse(s))===s;},
  parse(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12,0,0);},
  fmt(dt){return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());},
  add(s,n){const dt=D.parse(s);dt.setDate(dt.getDate()+n);return D.fmt(dt);},
  diff(a,b){return Math.round((D.parse(b)-D.parse(a))/86400000);},
  today(now){return D.fmt(now||new Date());},
  range(a,b){const out=[];if(!D.valid(a)||!D.valid(b)||a>b)return out;let c=a;while(c<=b&&out.length<400){out.push(c);c=D.add(c,1);}return out;},
  dow(s){return D.parse(s).getDay();},
  day(s){return D.parse(s).getDate();},
  month(s){return MONTHS[D.parse(s).getMonth()];},
  long(s){const d=D.parse(s);return d.getDate()+' '+MONTHS[d.getMonth()]+' '+DAY_NAMES[d.getDay()];},
  mid(s){const d=D.parse(s);return d.getDate()+' '+MONTHS[d.getMonth()];}
};
const T={
  toMin(t){const p=String(t).split(':');return (+p[0])*60+(+p[1]||0);},
  fmt(m){return pad(Math.floor(m/60))+':'+pad(m%60);}
};

/* Türkçe iyelik eki: 6'sı, 5'i, 10'u ... */
function trPoss(n){
  const last={1:'i',2:'si',3:'ü',4:'ü',5:'i',6:'sı',7:'si',8:'i',9:'u'};
  const tens={0:'ı',10:'u',20:'si',30:'u',40:'ı',50:'si',60:'ı',70:'i',80:'i',90:'ı'};
  n=Math.abs(Math.floor(n));
  if(n%10!==0)return last[n%10];
  if(n%100===0)return n===0?'ı':'ü';
  return tens[n%100];
}

const PREF_SCORE={preferred:1,possible:0.7};
const W_DAY=0.70,W_TIME=0.30;
const STATE_LABEL={preferred:'Müsaitim',possible:'Olabilir',unavailable:'Müsait değilim',unanswered:'Yanıtsız'};

/* Bir katılımcının [sMin,eMin) penceresine uygunluğu. */
function evalParticipant(p,date,sMin,eMin){
  const av=p.availability&&p.availability[date];
  const submitted=p.submissionStatus==='submitted';
  const dayPref=(av&&av.dayPreference)||'unanswered';
  if(dayPref==='unavailable')return {status:'unavailable'};
  if(dayPref==='unanswered')return {status:'pending'};
  if(eMin-sMin>=1440)return {status:'available',dayScore:PREF_SCORE[dayPref],timeScore:1,pref:PREF_SCORE[dayPref]*W_DAY+W_TIME,fullyPreferred:dayPref==='preferred'};
  let sum=0,n=0;
  for(let m=sMin;m<eMin;m+=30){
    const st=av.slots&&av.slots[T.fmt(m)];
    if(st==='unavailable')return {status:'unavailable'};
    if(st!=='preferred'&&st!=='possible')return {status:submitted?'unavailable':'pending'};
    sum+=PREF_SCORE[st];n++;
  }
  const timeScore=n?sum/n:0,dayScore=PREF_SCORE[dayPref];
  return {status:'available',dayScore,timeScore,pref:dayScore*W_DAY+timeScore*W_TIME,fullyPreferred:dayScore===1&&timeScore===1};
}

function compareCandidates(a,b){
  const ra=a.requiredPendingCount>0?1:0,rb=b.requiredPendingCount>0?1:0;
  if(ra!==rb)return ra-rb;
  if(a.availableCount!==b.availableCount)return b.availableCount-a.availableCount;
  if(a.preferredCount!==b.preferredCount)return b.preferredCount-a.preferredCount;
  if(Math.abs(a.averagePreferenceScore-b.averagePreferenceScore)>1e-9)return b.averagePreferenceScore-a.averagePreferenceScore;
  if(a.date!==b.date)return a.date<b.date?-1:1;
  return a.startMin-b.startMin;
}
function sameSet(a,b){if(a.length!==b.length)return false;const s=new Set(a);return b.every(x=>s.has(x));}
function overlaps(a,b){return a.date===b.date&&a.startMin<b.endMin&&b.startMin<a.endMin;}
function diversify(sorted,max){
  const picked=[];
  for(const c of sorted){
    if(picked.length>=max)break;
    const dup=picked.some(p=>overlaps(p,c)&&sameSet(p.availableIds,c.availableIds));
    if(!dup)picked.push(c);
  }
  return picked;
}

/* Ana motor: saf fonksiyon, arayüzden bağımsız. */
function computeBestMeetings(input){
  const meeting=input.meeting,participants=input.participants||[];
  const now=input.now||new Date(),maxResults=input.maxResults||5;
  const total=participants.length;
  const todayS=D.today(now),nowMin=now.getHours()*60+now.getMinutes();
  const dates=D.range(meeting.startDate,meeting.endDate);
  const eMin=T.toMin(meeting.earliestTime),lMin=T.toMin(meeting.latestTime);
  const dur=meeting.durationMinutes;
  const diag={
    participantCount:total,
    submittedCount:participants.filter(p=>p.submissionStatus==='submitted').length,
    totalWindows:0,rejectedByRequired:0,
    expired:meeting.endDate<todayS,
    incomplete:participants.some(p=>p.submissionStatus!=='submitted'),
    pendingRequired:participants.filter(p=>p.isRequired&&p.submissionStatus!=='submitted').map(p=>p.displayName),
    windowsTooLong:!(dur>0)||dur>lMin-eMin
  };
  if(!total||diag.windowsTooLong||!dates.length)return {results:[],all:[],diag};
  const cands=[];
  for(const date of dates){
    if(date<todayS)continue;
    for(let s=eMin;s+dur<=lMin;s+=30){
      if(date===todayS&&s<nowMin)continue;
      diag.totalWindows++;
      const e=s+dur;
      const det=[];let rejected=false;
      for(const p of participants){
        const r=evalParticipant(p,date,s,e);
        det.push(Object.assign({id:p.id,name:p.displayName,isRequired:!!p.isRequired},r));
        if(p.isRequired&&r.status==='unavailable')rejected=true;
      }
      if(rejected){diag.rejectedByRequired++;continue;}
      const av=det.filter(x=>x.status==='available');
      if(!av.length)continue;
      const un=det.filter(x=>x.status==='unavailable'),pe=det.filter(x=>x.status==='pending');
      const reqPending=det.filter(x=>x.isRequired&&x.status==='pending');
      const totalPref=av.reduce((a,x)=>a+x.pref,0);
      const prefCount=av.filter(x=>x.fullyPreferred).length;
      cands.push({
        key:date+'|'+T.fmt(s),
        date,startMin:s,endMin:e,start:T.fmt(s),end:T.fmt(e),durationMinutes:dur,
        availableIds:av.map(x=>x.id),unavailableIds:un.map(x=>x.id),pendingIds:pe.map(x=>x.id),
        availableCount:av.length,preferredCount:prefCount,possibleCount:av.length-prefCount,
        unavailableCount:un.length,pendingCount:pe.length,
        requiredPendingCount:reqPending.length,requiredPendingNames:reqPending.map(x=>x.name),
        requiredParticipantsSatisfied:reqPending.length===0,
        provisional:reqPending.length>0,
        totalPreferenceScore:totalPref,averagePreferenceScore:totalPref/av.length,
        participationPercentage:av.length/total,totalParticipants:total,
        details:det
      });
    }
  }
  cands.sort(compareCandidates);
  const results=diversify(cands,maxResults);
  return {results,all:cands,diag};
}

/* Kısa, yapısal açıklamalar (metni arayüz üretir). */
function explainCandidate(c){
  const out=[];
  out.push({type:'count',available:c.availableCount,total:c.totalParticipants});
  if(c.availableCount===c.totalParticipants)out.push({type:'everyone'});
  if(c.preferredCount>0)out.push({type:'preferred',n:c.preferredCount});
  if(c.possibleCount>0)out.push({type:'possible',n:c.possibleCount});
  if(c.unavailableCount>0)out.push({type:'unavailable',n:c.unavailableCount,names:c.details.filter(x=>x.status==='unavailable').map(x=>x.name)});
  if(c.pendingCount>0)out.push({type:'pending',n:c.pendingCount,names:c.details.filter(x=>x.status==='pending').map(x=>x.name)});
  if(c.requiredPendingCount>0)out.push({type:'requiredPending',names:c.requiredPendingNames});
  return out;
}

/* ---- Motor testleri (geliştirme zamanı, deterministik veri) ---- */
function runEngineTests(){
  const res=[];
  const t=(name,fn)=>{try{const r=fn();res.push({name,ok:r===true||r===undefined,info:r===true||r===undefined?'':String(r)});}catch(e){res.push({name,ok:false,info:e.message});}};
  const eq=(a,b)=>{if(JSON.stringify(a)!==JSON.stringify(b))throw new Error('beklenen '+JSON.stringify(b)+' gelen '+JSON.stringify(a));};
  const NOW=new Date(2026,9,1,9,0);
  const M=(o)=>Object.assign({startDate:'2026-10-21',endDate:'2026-10-22',durationMinutes:120,earliestTime:'18:00',latestTime:'23:00'},o||{});
  const sl=(from,to,st)=>{const o={};for(let m=T.toMin(from);m<T.toMin(to);m+=30)o[T.fmt(m)]=st||'preferred';return o;};
  const day=(pref,from,to,st)=>({dayPreference:pref,slots:from?sl(from,to,st):{}});
  const P=(id,o)=>Object.assign({id,displayName:id,isRequired:false,submissionStatus:'submitted',availability:{}},o||{});
  const run=(meeting,ps,now)=>computeBestMeetings({meeting,participants:ps,now:now||NOW});
  const U={dayPreference:'unavailable',slots:{}};

  t('tek katılımcı: tam kapsama aday üretir',()=>{
    const r=run(M(),[P('a',{availability:{'2026-10-21':day('preferred','18:00','23:00')}})]);
    eq(r.results[0].date,'2026-10-21');eq(r.results[0].start,'18:00');
    if(Math.abs(r.results[0].averagePreferenceScore-1)>1e-9)throw new Error('skor 1 olmalı');
  });
  t('kısmi örtüşme sayılmaz',()=>{
    const r=run(M(),[P('a',{availability:{'2026-10-21':day('preferred','18:00','21:00')}}),P('b',{availability:{'2026-10-21':day('preferred','19:00','20:00')}})]);
    eq(Math.max.apply(null,r.all.map(c=>c.availableCount)),1);
  });
  t('kesişim: 18-21 ve 19-22 → 19:00-21:00 ortak',()=>{
    const r=run(M(),[P('a',{availability:{'2026-10-21':day('preferred','18:00','21:00')}}),P('b',{availability:{'2026-10-21':day('preferred','19:00','22:00')}})]);
    eq(r.results[0].start,'19:00');eq(r.results[0].end,'21:00');eq(r.results[0].availableCount,2);
  });
  t('zorunlu katılımcı müsait değilse aday elenir',()=>{
    const r=run(M(),[P('a',{isRequired:true,availability:{'2026-10-21':U,'2026-10-22':U}}),P('b',{availability:{'2026-10-21':day('preferred','18:00','23:00')}})]);
    eq(r.results.length,0);if(!(r.diag.rejectedByRequired>0))throw new Error('rejectedByRequired > 0 olmalı');
  });
  t('zorunlu katılımcı yanıtsızsa sonuç geçici (provisional)',()=>{
    const r=run(M(),[P('a',{isRequired:true,submissionStatus:'pending'}),P('b',{availability:{'2026-10-21':day('preferred','18:00','23:00')}})]);
    if(!r.results.length||!r.results.every(c=>c.provisional))throw new Error('tüm sonuçlar provisional olmalı');
  });
  t('katılım sayısı tercih puanından önce gelir',()=>{
    const r=run(M(),[
      P('a',{availability:{'2026-10-21':day('possible','18:00','21:00','possible'),'2026-10-22':day('preferred','18:00','21:00')}}),
      P('b',{availability:{'2026-10-21':day('possible','18:00','21:00','possible'),'2026-10-22':day('preferred','18:00','21:00')}}),
      P('c',{availability:{'2026-10-21':day('possible','18:00','21:00','possible')}})]);
    eq(r.results[0].date,'2026-10-21');eq(r.results[0].availableCount,3);
  });
  t('yanıtsız ≠ müsait değil',()=>{
    const r=run(M(),[P('a',{availability:{'2026-10-21':day('preferred','18:00','23:00')}}),P('b',{submissionStatus:'pending'})]);
    eq(r.results[0].details.find(x=>x.id==='b').status,'pending');
  });
  t('tercih puanı: gün 1.0, saat 0.925 → 0.9775',()=>{
    const a=day('preferred','18:00','19:30','preferred');a.slots['19:30']='possible';
    const r=run(M(),[P('a',{availability:{'2026-10-21':a}})]);
    const c=r.all.find(x=>x.start==='18:00');
    if(Math.abs(c.averagePreferenceScore-0.9775)>1e-9)throw new Error('gelen '+c.averagePreferenceScore);
  });
  t('artık yıl ve yıl sonu',()=>{
    eq(D.range('2028-02-28','2028-03-01'),['2028-02-28','2028-02-29','2028-03-01']);
    eq(D.add('2026-12-31',1),'2027-01-01');eq(D.add('2027-02-28',1),'2027-03-01');eq(D.diff('2026-10-18','2026-10-21'),3);
  });
  t('süre izin verilen saatlere sığmıyorsa boş',()=>{
    const r=run(M({durationMinutes:600}),[P('a',{availability:{'2026-10-21':day('preferred','18:00','23:00')}})]);
    eq(r.results.length,0);eq(r.diag.windowsTooLong,true);
  });
  t('geçmiş pencereler atlanır',()=>{
    const r=run(M(),[P('a',{availability:{'2026-10-21':day('preferred','18:00','23:00')}})],new Date(2026,9,21,20,0));
    if(r.all.some(c=>c.date==='2026-10-21'&&c.startMin<1200))throw new Error('geçmiş pencere var');
    eq(r.all[0].start,'20:00');
  });
  t('çakışan aynı-kümeli pencereler tekilleşir',()=>{
    const r=run(M(),[P('a',{availability:{'2026-10-21':day('preferred','18:00','23:00')}}),P('b',{availability:{'2026-10-21':day('preferred','18:00','23:00')}})]);
    eq(r.all.length,7);eq(r.results.length,2);eq(r.results[0].key,r.all[0].key);
  });
  t('eşitlikte erken tarih/saat kazanır',()=>{
    const r=run(M(),[P('a',{availability:{'2026-10-21':day('preferred','18:00','23:00'),'2026-10-22':day('preferred','18:00','23:00')}})]);
    eq(r.results[0].key,'2026-10-21|18:00');
  });
  t('Türkçe iyelik eki',()=>{eq([trPoss(6),trPoss(5),trPoss(10),trPoss(3),trPoss(2)],['sı','i','u','ü','si']);});
  t('katılımcı yoksa boş sonuç',()=>{eq(run(M(),[]).results.length,0);});
  return res;
}

/*DATA-START*/
class VErr extends Error{constructor(m,f){super(m);this.field=f||null;}}
const clone=x=>JSON.parse(JSON.stringify(x));
function uid(){
  try{if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();}catch(e){}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);});
}
function makeCode(){const a='23456789ABCDEFGHJKMNPQRSTUVWXYZ';let s='';for(let i=0;i<6;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}

const TRANSITIONS={
  draft:['collecting_availability','cancelled'],
  collecting_availability:['results_ready','pending_confirmation','cancelled'],
  results_ready:['collecting_availability','pending_confirmation','cancelled'],

    if(anim){cn.classList.remove('tick');void cn.getBoundingClientRect();cn.classList.add('tick');}
  }
  function setSelected(i,opt){
    if(i<0||i>=N)return;

  }
  el.addEventListener('click',e=>{const t=e.target.closest('[data-i]');if(t){const i=+t.dataset.i;if(i<N&&o.onSelect)o.onSelect(i);}});
  el.addEventListener('keydown',e=>{
    let n=null;
    if(e.key==='ArrowRight'||e.key==='ArrowDown')n=Math.min(N-1,sel+1);
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp')n=Math.max(0,sel-1);
    else if(e.key==='Home')n=0;else if(e.key==='End')n=N-1;
    if(n!==null){e.preventDefault();if(o.onSelect)o.onSelect(n);}
  });
  center(false);
  if(sel>0){const k=sel;sel=0;cum=0;setSelected(k,{silent:true});}else{$$('path.w',el)[0]&&$$('path.w',el)[0].classList.add('sel');}
  if(o.states)setStates(o.states);
  return {el,setSelected,setStates,get index(){return sel;},get count(){return N;}};
}

/* ---- Lineer mekanik takvim: istasyon hattı, sabit pencere, kayan ray ---- */
function lineCalendar(o){
  const dates=o.dates,N=dates.length;let sel=Math.min(Math.max(o.selected||0,0),N-1);
  const el=document.createElement('div');el.className='lcal';
  const arr=(d,l)=>'<button class="larr" data-lc="'+d+'" aria-label="'+l+'"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="'+(d<0?'M15 5l-7 7 7 7':'M9 5l7 7-7 7')+'" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>';
  const showArr=o.arrows!==false;
  el.innerHTML='<div class="lhead"><span class="lmon"></span><span class="lwd"></span></div><div class="lrow">'+(showArr?arr(-1,'Önceki gün'):'')
    +'<div class="lview" tabindex="0" role="listbox" aria-label="Günler. Sol ve sağ ok tuşlarıyla gün değiştir."><div class="ltrack">'
    +dates.map((d,i)=>'<button class="st'+((D.dow(d)===0||D.dow(d)===6)?' wk':'')+'" role="option" data-i="'+i+'" aria-label="'+esc(D.long(d))+'" tabindex="-1"><small>'+DAY_SHORT[D.dow(d)]+'</small><span class="nd">'+D.day(d)+'</span><span class="sh" data-shp="'+i+'"></span></button>').join('')
    +'</div></div>'+(showArr?arr(1,'Sonraki gün'):'')+'</div>';
  const view=$('.lview',el),track=$('.ltrack',el),btns=$$('.st',el);
  function pos(){const w=view.clientWidth;track.style.transform='translateX('+Math.round(w/2-(sel+0.5)*60)+'px)';}
  function paint(){
    btns.forEach((b,i)=>{b.classList.toggle('cur',i===sel);b.setAttribute('aria-selected',String(i===sel));});
    const d=dates[sel];$('.lwd',el).textContent=D.day(d)+' '+D.month(d)+' '+DAY_NAMES[D.dow(d)];
    $$('.larr',el).forEach((b,i)=>{b.disabled=i===0?sel<=0:sel>=N-1;});pos();
  }
  function setSelected(i){if(i<0||i>=N)return;sel=i;paint();}
  function setStates(fn){$$('[data-shp]',el).forEach(g=>{const k=fn(+g.dataset.shp);g.innerHTML=k?shape(k,16):'';});}
  el.addEventListener('click',e=>{
    const a=e.target.closest('[data-lc]');if(a){const n=sel+(+a.dataset.lc);if(n>=0&&n<N&&o.onSelect)o.onSelect(n);return;}
    const s=e.target.closest('.st');if(s&&o.onSelect)o.onSelect(+s.dataset.i);
  });
  view.addEventListener('keydown',e=>{
    let n=null;if(e.key==='ArrowRight')n=Math.min(N-1,sel+1);else if(e.key==='ArrowLeft')n=Math.max(0,sel-1);
    if(n!==null){e.preventDefault();if(o.onSelect)o.onSelect(n);}
  });
  let dx0=null,sel0=0;
  view.addEventListener('pointerdown',ev=>{dx0=ev.clientX;sel0=sel;});
  view.addEventListener('pointermove',ev=>{
    if(dx0===null||Math.abs(ev.clientX-dx0)<8)return;
    const n=Math.max(0,Math.min(N-1,sel0-Math.round((ev.clientX-dx0)/60)));
    if(n!==sel&&o.onSelect)o.onSelect(n);
  });
  const endDrag=()=>{dx0=null;};
  view.addEventListener('pointerup',endDrag);view.addEventListener('pointercancel',endDrag);
  track.style.transition='none';paint();
  requestAnimationFrame(()=>{pos();requestAnimationFrame(()=>{track.style.transition='';});});
  window.addEventListener('resize',pos);
  if(o.states)setStates(o.states);
  return {el,setSelected,setStates,get index(){return sel;},get count(){return N;}};
}

  const f=$('#hfill');f.style.left=(e/1440*100)+'%';f.style.width=((l-e)/1440*100)+'%';
}
function hbSet(k,v){
  const d=S.draft;let e=T.toMin(d.earliest),l=T.toMin(d.latest);
  if(k==='e')e=Math.max(0,Math.min(l-HB_STEP,v));else l=Math.min(1440,Math.max(e+HB_STEP,v));
  d.earliest=T.fmt(e);d.latest=T.fmt(l);d.errors={};hbPaint();
}
function hourStep(k,dl){
  const d=S.draft;let e=T.toMin(d.earliest),l=T.toMin(d.latest);
  if(k==='earliest')hbSet('e',e+dl);else hbSet('l',l+dl);
}
let holdT=null;
function stopHold(){if(holdT){clearTimeout(holdT);holdT=null;render();}}
document.addEventListener('pointerdown',ev=>{
  const b=ev.target.closest('[data-hold]');if(!b||!S.draft||!$app.contains(b))return;
  ev.preventDefault();
  const k=b.dataset.k,dl=+b.dataset.d,t0=Date.now();
  hourStep(k,dl);
  const tick=()=>{hourStep(k,dl);const el=Date.now()-t0;holdT=setTimeout(tick,el<700?220:el<1600?120:60);};
  holdT=setTimeout(tick,380);
});
document.addEventListener('pointerup',stopHold);
document.addEventListener('pointercancel',stopHold);
function bindHourBar(){
  const bar=$('#hbar');if(!bar)return;
  hbPaint();
  bar.addEventListener('pointerdown',ev=>{
    ev.preventDefault();
    const d=S.draft,r=bar.getBoundingClientRect(),f=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width));
    const t=Math.round(f*1440/HB_STEP)*HB_STEP;
    const de=Math.abs(T.toMin(d.earliest)-t),dl=Math.abs(T.toMin(d.latest)-t);
    S.hbDrag=de<=dl?'e':'l';bar.setPointerCapture(ev.pointerId);
    hbSet(S.hbDrag,t);
  });
  bar.addEventListener('pointermove',ev=>{
    if(!S.hbDrag)return;
    const r=bar.getBoundingClientRect(),f=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width));
    hbSet(S.hbDrag,Math.round(f*1440/HB_STEP)*HB_STEP);
  });
  const stop=()=>{if(S.hbDrag){S.hbDrag=null;render();}};
  bar.addEventListener('pointerup',stop);bar.addEventListener('pointercancel',stop);
}
/* aralık barı: iki mor top, bugünden itibaren 30 günlük ölçek (0..29) */
const RB_SPAN=29;
function rbIdx(date){return Math.max(0,Math.min(RB_SPAN,D.diff(D.today(),date)));}
function rbPaint(){
  const d=S.draft;if(!d)return;const bar=$('#rbar');if(!bar)return;
  const si=rbIdx(d.startDate),ei=rbIdx(d.endDate),n=D.range(d.startDate,d.endDate).length;
  const ls=si/RB_SPAN*100,le=ei/RB_SPAN*100;
  $('#rbs').style.left=ls+'%';$('#rbe').style.left=le+'%';
  const f=$('#rfill');f.style.left=ls+'%';f.style.width=Math.max(0,le-ls)+'%';
  $('#rbs').setAttribute('aria-valuetext',D.long(d.startDate));$('#rbe').setAttribute('aria-valuetext',D.long(d.endDate));
  const fs=$('#f-s'),fe=$('#f-e');if(fs)fs.value=d.startDate;if(fe){fe.value=d.endDate;fe.min=d.startDate;}
  $('#rcount').textContent=n?n+' gün seçili. En fazla 30 gün.':'Geçerli bir aralık seç.';
}
function rbMove(ev){
  const d=S.draft,bar=$('#rbar'),r=bar.getBoundingClientRect();
  const f=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width));
  let date=D.add(D.today(),Math.round(f*RB_SPAN));
  if(S.rbDrag==='s'){if(date>d.endDate)date=d.endDate;d.startDate=date;}
  else{if(date<d.startDate)date=d.startDate;d.endDate=date;}
  d.errors={};rbPaint();
}
function bindRangeBar(){
  const bar=$('#rbar');if(!bar)return;
  rbPaint();
  bar.addEventListener('pointerdown',ev=>{
    ev.preventDefault();
    const d=S.draft,r=bar.getBoundingClientRect(),f=(ev.clientX-r.left)/r.width;
    const ds=Math.abs(rbIdx(d.startDate)/RB_SPAN-f),de=Math.abs(rbIdx(d.endDate)/RB_SPAN-f);
    S.rbDrag=ds<=de?'s':'e';bar.setPointerCapture(ev.pointerId);rbMove(ev);
  });
  bar.addEventListener('pointermove',ev=>{if(S.rbDrag)rbMove(ev);});
  const stop=()=>{if(S.rbDrag){S.rbDrag=null;render();}};
  bar.addEventListener('pointerup',stop);bar.addEventListener('pointercancel',stop);
  bar.addEventListener('keydown',ev=>{
    const t=ev.target.closest('.rd');if(!t)return;
    const k=ev.key==='ArrowRight'?1:ev.key==='ArrowLeft'?-1:0;if(!k)return;
    ev.preventDefault();const d=S.draft;
    if(t.dataset.rb==='s'){const nd=D.add(d.startDate,k);if(nd<=d.endDate&&nd>=D.today())d.startDate=nd;}
    else{const nd=D.add(d.endDate,k);if(nd>=d.startDate&&D.diff(D.today(),nd)<=RB_SPAN)d.endDate=nd;}
    d.errors={};rbPaint();
  });
}
CHANGES.startDate=el=>{const d=S.draft;if(!D.valid(el.value))return;d.startDate=el.value;if(d.endDate<d.startDate)d.endDate=d.startDate;d.errors={};render();};

ACTIONS.setSpan=el=>{const d=S.draft;d.endDate=D.add(d.startDate,+el.dataset.n-1);d.errors={};render();};

  const d=S.draft,k=el.dataset.k,dl=+el.dataset.d;let e=T.toMin(d.earliest),l=T.toMin(d.latest);
  if(k==='earliest')e=Math.max(0,Math.min(l-30,e+dl));else l=Math.max(e+30,Math.min(1440,l+dl));
  d.earliest=T.fmt(e);d.latest=T.fmt(l);d.errors={};render();

ACTIONS.cStep=el=>{
  const d=S.draft,dl=+el.dataset.d;d.errors={};

      if(!d.title.trim())d.errors.title='Buluşmaya bir isim ver.';

    if(d.step===3){

      if(n>30){d.errors.dates='En fazla 30 günlük aralık seçebilirsin.';render();return;}
      if(d.endDate<D.today()){d.errors.dates='Bu aralık geçmişte kalmış.';render();return;}
    }
  }
  d.step=Math.max(1,Math.min(4,d.step+dl));render();
};
ACTIONS.cCreate=()=>{

/* ---- MÜSAİTLİK: tek tık müsait, çift tık olabilir, boş = müsait değil ---- */
const PERIODS=[{k:'sabah',n:'Sabah',s:0,e:660},{k:'oglen',n:'Öğlen',s:660,e:780},{k:'ogledensonra',n:'Öğleden sonra',s:780,e:1020},{k:'aksamustu',n:'Akşamüstü',s:1020,e:1140},{k:'aksam',n:'Akşam',s:1140,e:1320},{k:'gece',n:'Gece',s:1320,e:1440}];
let AV=null,lastTap={t:'',time:0};
function avDayState(p,date){return (p.availability[date]&&p.availability[date].dayPreference)||'unanswered';}
function avDerive(e){const v=Object.values(e.slots);e.dayPreference=v.indexOf('preferred')>=0?'preferred':v.length?'possible':'unavailable';}

  AV.idx=fo>=0?fo:(ff>=0?ff:0);
  const e=T.toMin(m.earliestTime),l=T.toMin(m.latestTime);
  const per=PERIODS.filter(p=>Math.max(p.s,e)<Math.min(p.e,l));

  const cal=lineCalendar({dates,selected:AV.idx,onSelect:i=>avGo(i)});

  const panel=$('#avPanel');

  avRefresh();
}
function avLeave(){
  if(!AV)return;const d=AV.dates[AV.idx];
  if(d>=AV.today&&!AV.cur.availability[d]){AV.cur.availability[d]={dayPreference:'unavailable',slots:{}};avSave(d);}
}
function avGo(i){if(!AV||i<0||i>=AV.dates.length)return;avLeave();AV.idx=i;AV.cal.setSelected(i);avRefresh();}
function avStateFn(i){const s=avDayState(AV.cur,AV.dates[i]);return s==='unanswered'?'pending':s;}
function avRefresh(){
  if(!AV)return;
  const m=AV.meeting,date=AV.dates[AV.idx],e=avEntry(true),past=date<AV.today;
  AV.cal.setStates(avStateFn);
  let body='';
  if(past)body='<p class="muted">Bu gün geçmişte kaldı.</p>';
  else if(allDayM(m)){
    body='<div class="row" style="gap:10px;flex-wrap:wrap"><button class="btn'+(e.dayPreference==='preferred'?' dark':' ghost')+'" data-act="setDay" data-v="preferred">'+shape('preferred',16)+' müsaitim</button></div><p class="intro-note" style="font-size:15px;margin-top:14px">saat derdi yok, sadece hangi günlerin uygun olduğunu işaretle. detayı sonra birlikte konuşursunuz.</p>';
  }
  else{
    const a=T.toMin(m.earliestTime),l=T.toMin(m.latestTime);
    PERIODS.forEach(per=>{
      const lo=Math.max(per.s,a),hi=Math.min(per.e,l);if(lo>=hi)return;
      const tiles=[];for(let s=lo;s+30<=hi;s+=30)tiles.push(s);if(!tiles.length)return;
      body+='<div class="pline"><span class="pvert" aria-hidden="true">'+per.n+'</span><div class="slots" role="group" aria-label="'+per.n+' saatleri">'+tiles.map(s=>avTile(T.fmt(s),e.slots[T.fmt(s)])).join('')+'</div></div>';
    });
  }
  body+=avFoot();
  const done=AV.dates.filter(d=>avDayState(AV.cur,d)!=='unanswered').length;
  $('#avPanel').innerHTML='<p class="small muted" style="text-align:center;margin:0 0 8px">'+esc(AV.cur.displayName)+' · '+done+'/'+AV.dates.length+' gün yanıtlandı</p>'+body;
}
function avFoot(){
  const i=AV.idx,N=AV.dates.length,d=AV.dates[i];
  const arr=dir=>'<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="'+(dir<0?'M15 5l-7 7 7 7':'M9 5l7 7-7 7')+'" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  return '<div class="avfoot"><button class="btn sm ghost" data-act="clearDay">Günü temizle</button><span class="avday">'+D.day(d)+' '+D.month(d).slice(0,3)+' '+DAY_SHORT[D.dow(d)]+'</span>'
    +'<button class="larr" data-act="avPrev" aria-label="Önceki gün"'+(i<=0?' disabled':'')+'>'+arr(-1)+'</button><button class="larr" data-act="avNext" aria-label="Sonraki gün"'+(i>=N-1?' disabled':'')+'>'+arr(1)+'</button></div>';
}
ACTIONS.avPrev=()=>avGo(AV.idx-1);
ACTIONS.avNext=()=>avGo(AV.idx+1);
function avTile(t,st){return '<button class="slot'+(st?' s-'+st:'')+'" data-t="'+t+'" aria-label="'+t+(st?', '+esc(STATE_LABEL[st]):', boş')+'">'+t+(st?shape(st,12):'')+'</button>';}
function avRuns(entry,e,l){
  const out=[];let cur=null;
  for(let s=e;s+30<=l;s+=30){
    const v=entry.slots[T.fmt(s)]||null;
    if(cur&&cur.k===v&&v){cur.end=s+30;}else{if(cur&&cur.k)out.push(cur);cur=v?{k:v,start:s,end:s+30}:{k:null};}
  }
  if(cur&&cur.k)out.push(cur);
  return out.map(r=>({k:r.k,a:T.fmt(r.start),b:T.fmt(r.end)}));
}
function avEntry(noCreate){const d=AV.dates[AV.idx];if(AV.cur.availability[d])return AV.cur.availability[d];const e={dayPreference:'unanswered',slots:{}};if(!noCreate)AV.cur.availability[d]=e;return e;}
function avSet(t,v){
  const e=avEntry();if(v)e.slots[t]=v;else delete e.slots[t];
  const tile=$('.slot[data-t="'+t+'"]',$('#avPanel'));
  if(tile){tile.className='slot'+(v?' s-'+v:'');tile.setAttribute('aria-label',t+(v?', '+STATE_LABEL[v]:', boş'));tile.innerHTML=t+(v?shape(v,12):'');}
}
function avCommit(){const d=AV.dates[AV.idx],e=avEntry();avDerive(e);avSave(d);avRefresh();}
function avDown(ev){
  const tile=ev.target.closest('.slot');if(!tile||!AV)return;
  ev.preventDefault();
  const e=avEntry(),start=tile.dataset.t,had=!!e.slots[start];
  let dragging=false;
  const mv=x=>{
    const el=document.elementFromPoint(x.clientX,x.clientY),t=el&&el.closest&&el.closest('.slot');
    if(!t||!$('#avPanel').contains(t))return;
    if(!dragging&&t.dataset.t===start)return;
    if(!dragging){dragging=true;avSet(start,had?null:'preferred');}
    avSet(t.dataset.t,had?null:'preferred');
  };
  const up=()=>{
    document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
    if(!dragging){
      const cur=avEntry().slots[start];
      avSet(start,cur?null:'preferred');
    }
    avCommit();
  };
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
}
function avSave(d){try{DB.saveAvailability(AV.pid,d,AV.cur.availability[d]);DB.refreshStatus(AV.mid);}catch(err){console.error(err);toast('Kaydedilemedi: '+err.message,3500);}}

ACTIONS.setDay=el=>{const e=avEntry(),v=el.dataset.v;e.dayPreference=e.dayPreference===v?'unavailable':v;e.slots={};avSave(AV.dates[AV.idx]);avRefresh();};
ACTIONS.clearDay=()=>{const d=AV.dates[AV.idx];delete AV.cur.availability[d];try{DB.saveAvailability(AV.pid,d,null);DB.refreshStatus(AV.mid);}catch(e){}avRefresh();toast('Gün temizlendi');};

};

function explainText(x){
  switch(x.type){
    case 'count':return x.total+' kişiden '+x.available+"'"+trPoss(x.available)+' bu saatte müsait.';
    case 'everyone':return 'Herkes bu saatte müsait.';
    case 'preferred':return x.n+' kişi için bu, tercih ettiği bir zaman.';
    case 'possible':return x.n+' kişi için “olabilir” seviyesinde.';
    case 'unavailable':return x.names.join(', ')+(x.n>1?' müsait değil.':' müsait değil.');
    case 'pending':return x.n+' kişinin yanıtı bekleniyor ('+x.names.join(', ')+').';
    case 'requiredPending':return 'Zorunlu katılımcının yanıtı bekleniyor: '+x.names.join(', ')+'.';
  }
  return '';
}

  const INK='#25212B',PURPLE='#5C32B5',PAPER='#FFF9EC',BG='#F5EBD6',GREEN='#65D6A0',CORAL='#FF6257',GREY='#7d747c',OK='#2E8B5F';
  const F='Arial, Helvetica, sans-serif';
  const rr=(x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();};
  const yes=ps.filter(p=>need.has(p.id)&&p.finalConfirmation==='yes').length;
  const confirmed=m.status==='confirmed';
  const T=(t,x,y,sz,col,w,al)=>{g.fillStyle=col;g.font=(w||'700')+' '+sz+'px '+F;g.textAlign=al||'left';g.fillText(t,x,y);g.textAlign='left';};
  const CX=20,CY=20,CW=W-40,CH=H-40;
  g.fillStyle=BG;g.fillRect(0,0,W,H);
  rr(CX+12,CY+12,CW,CH,28);g.fillStyle=INK;g.fill();          // gölge
  rr(CX,CY,CW,CH,28);g.fillStyle=PAPER;g.fill();
  g.save();rr(CX,CY,CW,CH,28);g.clip();
  g.fillStyle=PURPLE;g.fillRect(CX,CY,CW,120);                  // mor bant
  g.strokeStyle='rgba(120,90,40,0.10)';g.lineWidth=2;           // desen
  for(let x=CX-CH;x<CX+CW;x+=22){g.beginPath();g.moveTo(x,CY+120);g.lineTo(x+CH,CY+120+CH);g.stroke();}
  g.restore();
  g.fillStyle=INK;g.fillRect(CX,CY+118,CW,4);
  rr(CX,CY,CW,CH,28);g.lineWidth=6;g.strokeStyle=INK;g.stroke();
  T('buluşma vizesi',60,80,20,'#fff','700');
  T('gurupla',W-60,84,40,'#fff','800','right');
  // ilerleme barı + damga
  rr(60,170,W-120,46,23);g.fillStyle='#fff';g.fill();
  g.save();rr(60,170,W-120,46,23);g.clip();g.strokeStyle='rgba(120,90,40,0.25)';g.lineWidth=8;
  for(let x=40;x<W;x+=24){g.beginPath();g.moveTo(x,170);g.lineTo(x+46,216);g.stroke();}g.restore();
  rr(60,170,W-120,46,23);g.lineWidth=5;g.strokeStyle=INK;g.stroke();
  g.beginPath();g.moveTo(W/2,160);g.lineTo(W/2+18,193);g.lineTo(W/2,226);g.lineTo(W/2-18,193);g.closePath();g.fillStyle=PURPLE;g.fill();g.lineWidth=4;g.strokeStyle=INK;g.stroke();
  // damga
  const sx=W-130,sy=285;
  [72,64].forEach((r,i)=>{g.beginPath();g.arc(sx,sy,r,0,Math.PI*2);g.lineWidth=i?2:4;g.strokeStyle=OK;g.stroke();});
  g.save();g.translate(sx,sy);g.rotate(-0.2);
  T(confirmed?'onaylandı':'onay bekliyor',0,-2,20,OK,'800','center');
  T(D.day(c.date)+' '+D.month(c.date),0,24,16,OK,'700','center');g.restore();
  // alanlar
  const X=60,X2=W/2+20;
  T('buluşma',X,300,16,GREY);T(m.title.slice(0,26),X,340,38,INK,'800');
  T('tarih',X,400,16,GREY);T(D.day(c.date)+' '+D.month(c.date),X,442,36,INK,'800');
  T('saat',X2,400,16,GREY);T(c.start+'–'+c.end,X2,442,32,INK,'800');
  T('gün',X,500,16,GREY);T(DAY_NAMES[D.dow(c.date)],X,534,26,INK,'700');
  T('süre',X2,500,16,GREY);T(dur(c.durationMinutes),X2,534,26,INK,'700');
  T('yer',X,596,16,GREY);T(m.location||'henüz belirlenmedi',X,632,26,INK,'700');
  T('yolcular · '+yes+'/'+need.size+' onay',X,696,16,GREY);
  let px=X,py=716;
  ps.filter(p=>need.has(p.id)).slice(0,8).forEach(p=>{
    const f=p.finalConfirmation,name=p.displayName.slice(0,16);
    g.font='700 20px '+F;const tw=g.measureText(name).width;const w=tw+52;
    if(px+w>W-60){px=X;py+=50;}
    rr(px,py,w,38,19);g.fillStyle='#fff';g.fill();g.lineWidth=3;g.strokeStyle=INK;g.stroke();
    g.beginPath();g.arc(px+20,py+19,8,0,Math.PI*2);g.fillStyle=f==='yes'?GREEN:f==='no'?CORAL:'#E9E1D0';g.fill();g.lineWidth=2;g.strokeStyle=INK;g.stroke();
    T(name,px+36,py+26,20,INK,'700');px+=w+10;
  });
  // alt şerit
  g.fillStyle='rgba(255,255,255,.8)';g.fillRect(CX,CY+CH-96,CW,76);
  g.fillStyle=INK;g.fillRect(CX,CY+CH-96,CW,3);
  T('vs'+m.code.toLowerCase()+'<'+c.date.replace(/-/g,'')+'<'+c.start.replace(':','')+'<'+c.durationMinutes+'<'+yes+'<'+need.size,60,CY+CH-52,20,INK,'700');
  return new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('png üretilemedi')),'image/png'));
}
ACTIONS.copyVize=async()=>{
  const m=curMeeting(),c=m.selectedCandidate;
  if(!c){toast('Henüz bir tarih seçilmedi');return;}
  try{
    const ps=DB.getParticipants(m.id),need=new Set(c.availableIds.concat(m.requiredParticipantIds));
    const b=await vizeBlob(m,c,ps,need);
    try{
      if(!navigator.clipboard||!window.ClipboardItem)throw new Error('pano yok');
      await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);
      toast('Vize kopyalandı, istediğin yere yapıştır');
    }catch(e){
      const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='gurupla-vize-'+m.code+'.png';a.click();
      toast('Pano desteklenmedi, vize png olarak indirildi');
    }
  }catch(e){console.error(e);toast('Vize görseli oluşturulamadı: '+e.message,3500);}
};
ACTIONS.rsvp=el=>{const m=curMeeting(),ps=DB.getParticipants(m.id),me=getMe(m,ps);const v=el.dataset.v;DB.saveConfirmation(me.id,me.finalConfirmation===v?null:v);render();toast(v==='yes'?'Geliyorsun':'Gelemeyeceğini bildirdin');};
ACTIONS.copyConfirmLink=()=>{const m=curMeeting();copyText(location.href.split('#')[0]+'#/m/'+m.code+'/confirm');};
ACTIONS.icsDownload=()=>{const m=curMeeting();if(!m.selectedCandidate)return;download('gurupla-'+m.code+'.ics','text/calendar;charset=utf-8',icsFor(m,m.selectedCandidate));toast('Takvim dosyası indirildi');};
ACTIONS.saveLoc=()=>{const m=curMeeting();DB.updateMeeting(m.id,{location:$('#f-loc2').value.trim()});render();toast('Yer kaydedildi');};
ACTIONS.changeTime=async()=>{if(await dialog({title:'Zaman değiştirilsin mi?',text:'Verilen onaylar sıfırlanır; yanıtların korunur ve yeni bir seçenek seçersin.',ok:'Değiştir'})){const m=curMeeting();DB.saveFinalDecision(m.id,null);go('m/'+m.code+'/results');}};
ACTIONS.cancelMeeting=async()=>{if(await dialog({title:'Buluşma iptal edilsin mi?',text:'Katılımcılar bu buluşmaya yanıt veremez ve bu işlem geri alınamaz.',ok:'Evet, iptal et',tone:'coral'})){DB.cancelMeeting(curMeeting().id);render();toast('Buluşma iptal edildi');}};
ACTIONS.demoAll=()=>{const m=curMeeting();DB.getParticipants(m.id).forEach(p=>{if(m.selectedCandidate.availableIds.includes(p.id)||m.requiredParticipantIds.includes(p.id))DB.saveConfirmation(p.id,'yes');});render();};

/* ---- TESTLER ---- */
function screenTests(){
  const r=runEngineTests(),ok=r.filter(x=>x.ok).length;
  $app.innerHTML=shell('<section class="panel rivets" style="max-width:780px;margin:10px auto"><h2>Gurupla Engine testleri</h2><p class="'+(ok===r.length?'':'err')+'" style="margin:8px 0 14px"><b>'+ok+' / '+r.length+'</b> test geçti</p><div class="plist">'
    +r.map(x=>'<div class="prow">'+shape(x.ok?'preferred':'unavailable',18)+'<span class="nm">'+esc(x.name)+'</span>'+(x.info?'<span class="small err">'+esc(x.info)+'</span>':'')+'</div>').join('')+'</div><div class="row mt"><a class="btn ghost" href="#/">Ana sayfa</a></div><p class="small muted mt">Konsoldan da çalıştırabilirsin: <code>guruplaTests()</code></p></section>');
}

/* ---- yönlendirme ---- */
function stateScreen(o){$app.innerHTML=shell(emptyState(o));}
function screenMeeting(code,stage){
  let m=DB.getMeeting(code);
  if(!m){stateScreen({title:'Buluşma bulunamadı',text:'“'+esc(code||'')+'” kodlu bir buluşma bu tarayıcıda yok. Kodu kontrol edip tekrar dene.',actions:'<a class="btn" href="#/join">Kodu yeniden gir</a><a class="btn ghost" href="#/create">Yeni buluşma</a>'});return;}
  if(stage==='join'&&m.status!=='cancelled'){screenJoin(m);return;}
  const viewOnly=m.status!=='cancelled'&&!Session.get(m.id)&&(stage==='results'||stage==='confirm');
  if(m.status!=='cancelled'&&!Session.get(m.id)&&!viewOnly){screenJoin(m);return;}
  DB.refreshStatus(m.id);m=DB.getMeeting(code);
  const ps=DB.getParticipants(m.id),me=viewOnly?null:getMe(m,ps);
  if(viewOnly){
    if(stage==='results')screenResults(m,ps,null);else screenConfirm(m,ps,null);
    $('#main').insertAdjacentHTML('afterbegin','<div class="note info" style="margin-bottom:14px"><b>sadece görüntülüyorsun.</b> tarihe katılmak ve onay vermek için önce buluşmaya katıl. <a class="btn sm" style="margin-left:8px" href="#/m/'+m.code+'/join">Buluşmaya katıl</a></div>');
    return;
  }
  if(m.status==='cancelled'){stateScreen({title:'Bu buluşma iptal edildi',text:'“'+esc(m.title)+'” organizatör tarafından iptal edildi. Eski yanıtlar silinmedi ama artık yeni yanıt alınmıyor.',actions:'<a class="btn" href="#/create">Yeni buluşma oluştur</a><a class="btn ghost" href="#/">Ana sayfa</a>',a:'unavailable',b:'unavailable',c:'unavailable'});return;}
  if(!me){stateScreen({title:'Katılımcı yok',text:'Bu buluşmada henüz kimse yok.',actions:'<a class="btn" href="#/m/'+m.code+'/join">Katıl</a>'});return;}
  switch(stage){
    case 'avail':screenAvail(m,ps,me);break;
    case 'results':screenResults(m,ps,me);break;
    case 'confirm':screenConfirm(m,ps,me);break;
    default:if(isOrg(m,me))screenInvite(m,ps,me);else screenAvail(m,ps,me);
  }
}
async function render(fresh){
  const s=seg(),key=s.join('/'),y=window.scrollY;
  AV=null;S.calHero=null;
  if(fresh){try{if(s[0]==='m'&&s[1])await fetchBundle(s[1]);else if(!s.length)await Promise.all(mineCodes().map(c=>fetchBundle(c)));}catch(e){console.error(e);}}
  document.title=s[0]==='m'?'gurupla · buluşma':'gurupla';
  try{
    if(!s.length)screenLanding();
    else if(s[0]==='create')screenCreate();
    else if(s[0]==='join')screenJoinCode();
    else if(s[0]==='tests')screenTests();
    else if(s[0]==='m')screenMeeting(s[1],s[2]||'invite');
    else stateScreen({title:'Sayfa bulunamadı',text:'Aradığın sayfa yok.',actions:'<a class="btn" href="#/">Ana sayfa</a>'});
  }catch(err){
    console.error(err);
    $app.innerHTML=shell('<section class="panel empty"><h2>Bir şey ters gitti</h2><p>'+esc(err.message)+'</p><div class="row mt" style="justify-content:center"><a class="btn" href="#/">Ana sayfa</a></div></section>');
  }
  if(key!==lastPath){window.scrollTo(0,0);lastPath=key;}else window.scrollTo(0,y);
}
window.addEventListener('hashchange',()=>render(true));
window.guruplaTests=runEngineTests;
render(true);
/*UI-END*/
